name: Hello World AWS Test

on:
  push:
    branches:
      - main
      - KAN-1--init
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug OIDC Token Claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Current sub claim is:"
          jq -R 'split(".") | .[1] | @base64d | fromjson | .sub' <<< "$TOKEN"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::357196064218:role/github-terraform-vpc
          aws-region: eu-central-1

      - name: Verify AWS Connection
        run: |
          echo "Hello World from GitHub Actions!"
          aws sts get-caller-identity